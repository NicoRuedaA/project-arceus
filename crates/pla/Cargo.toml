[package]
name = "pla"
version = "0.1.0"
edition = "2021"
description = "Pokemon Legends: Arceus port crate (sheet-driven)"
license = "MIT"

[dependencies]
sheetty = { path = "../sheetty" }
phf = { version = "0.13", default-features = false }
mlua = { version = "0.12", features = ["lua53", "vendored"] }
bevy = { version = "0.19.1", default-features = false, features = ["std", "bevy_asset", "bevy_render", "bevy_core_pipeline", "bevy_post_process", "bevy_sprite", "bevy_sprite_render", "bevy_pbr", "bevy_light", "bevy_image", "bevy_animation", "bevy_gltf", "bevy_scene", "bevy_world_serialization", "tonemapping_luts", "zstd_rust", "bevy_log", "bevy_window", "bevy_winit", "x11", "wayland", "bevy_state", "png", "debug", "bevy_ui", "bevy_ui_render", "bevy_text", "default_font", "bevy_gilrs"] }
bevy_gltf = { version = "0.19.1", default-features = false, features = ["bevy_animation"] }
bevy_audio = { version = "0.19.1", default-features = false, features = ["wav", "vorbis"] }
tegra_swizzle = "0.4"
bcdec_rs = "0.2.0"
oozextract = "=0.5.5"
png = "0.18"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
# GPU adapter probe of the automation mode (same version Bevy already builds; no extra backend).
wgpu = { version = "29.0.4", default-features = false }

# WGSL validation of the terrain splat shader in unit tests (same naga Bevy already builds).
[dev-dependencies]
naga = { version = "29.0.4", features = ["wgsl-in"] }

[build-dependencies]
sheetty = { path = "../sheetty" }
phf_codegen = "0.13"

# The viewer carries its start-up schedule guard (`cargo test -p pla --example port_viewer`).
[[example]]
name = "port_viewer"
test = true
